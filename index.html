<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DDD 이직 필터</title>
  <link rel="icon" type="image/png" href="ddd_logo_1522.png">
  <link rel="apple-touch-icon" href="ddd_logo_1522.png">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, sans-serif; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas, #preview { max-width: 100%; max-height: 100%; aspect-ratio: 9 / 16; background: #111; }
    #preview { display: none; }
    #controls { position: fixed; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom)); display: flex; gap: 12px; justify-content: center; }
    button { font-size: 18px; padding: 14px 28px; border: 0; border-radius: 999px; background: #ffd400; color: #000; font-weight: 700; }
    button[hidden] { display: none; }
    #msg { position: fixed; top: 16px; left: 16px; right: 16px; text-align: center; font-size: 15px; }
    /* iOS는 display:none 인 video 의 프레임 갱신을 멈출 수 있어 화면 밖 1px 로 숨김 */
    video#camera { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    /* 시작 신호: 화면에만 보이고 녹화(canvas)에는 안 들어감 */
    #signal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
              font: 800 72px -apple-system, sans-serif; color: #ffd400; text-shadow: 0 2px 8px rgba(0,0,0,.5); opacity: 0; }
    /* 버전·진단 표시: 화면에만 보이고 녹화(canvas)에는 안 들어감 */
    #ver { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 8px; font-size: 11px; color: #fff;
           background: rgba(0,0,0,.5); padding: 2px 6px; border-radius: 4px; pointer-events: none; z-index: 10; }
    #signal.on { animation: signal 1.2s ease-out; }
    @keyframes signal { 0% { opacity: 1; transform: scale(1.3); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" width="720" height="1280"></canvas>
    <video id="preview" controls playsinline></video>
  </div>
  <video id="camera" playsinline muted></video>
  <p id="msg" role="status"></p>
  <div id="signal" aria-hidden="true">START</div>
  <div id="ver" aria-hidden="true"></div>
  <div id="controls">
    <button id="camera-btn">카메라 켜기</button>
    <button id="start-btn" hidden>시작</button>
    <button id="stop-btn" hidden>중단</button>
    <button id="save-btn" hidden>저장</button>
    <button id="retry-btn" hidden>다시 찍기</button>
  </div>
  <!-- GitHub Pages 는 JS 를 10분 캐시함 → 매번 다른 주소로 불러 항상 최신 파일을 받는다 -->
  <script type="module">import(`./app.js?v=${Date.now()}`);</script>
</body>
</html>
